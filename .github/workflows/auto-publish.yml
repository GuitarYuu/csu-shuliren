# ============================================================================
# 投稿自动发布：Issue 被打上 publish 标签 → 生成 docs/posts 文章 → 提交 main
# 双重保险：仅当 打标签者 == 仓库所有者 且 Issue 处于开启状态 时才触发
# ============================================================================
name: Auto Publish（投稿自动发布）

on:
  issues:
    types: [labeled]

permissions:
  contents: write   # 推送文章文件到 main
  issues: write     # 评论并关闭 Issue
  actions: write    # 触发 build-site 工作流（GITHUB_TOKEN 的 push 不会自动触发其他工作流）

concurrency:
  group: auto-publish
  cancel-in-progress: false   # 多篇审核发布时排队执行，避免 push 冲突

jobs:
  publish:
    name: 由 publish 标签生成文章并提交
    if: >-
      github.event.label.name == 'publish' &&
      github.actor == github.repository_owner &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载资料汇总附件（如有）
        id: attachment
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          WORKER_URL: https://csu-shuliren.2544864177.workers.dev
        run: |
          FID=$(printf '%s' "$ISSUE_BODY" | grep -m1 '^file: ' | sed 's/^file: *//' | tr -d '\r')
          FNAME=$(printf '%s' "$ISSUE_BODY" | grep -m1 '^filename: ' | sed 's/^filename: *//' | tr -d '\r')
          PATH_OUT=""
          if [ -n "$FID" ]; then
            if printf '%s' "$FID" | grep -qE '^[A-Za-z0-9]{4,32}$'; then
              SAFE=$(printf '%s' "$FNAME" | sed 's#[/\\:*?"<>|#&]#-#g' | cut -c1-80)
              [ -n "$SAFE" ] || SAFE="file"
              DEST="docs/posts/resources/files/${FID}-${SAFE}"
              mkdir -p "$(dirname "$DEST")"
              if curl -fsSL --max-time 180 "${WORKER_URL}/files/${FID}" -o "$DEST"; then
                PATH_OUT="$DEST"
                echo "附件已下载：$DEST（$(wc -c < "$DEST") 字节）"
              else
                echo "::warning::附件下载失败（可能已被清理），文章将不包含下载链接"
                rm -f "$DEST"
              fi
            else
              echo "::warning::附件 ID 格式非法，跳过下载"
            fi
          fi
          echo "path=$PATH_OUT" >> "$GITHUB_OUTPUT"

      - name: 提取附件全文（供站内搜索）
        id: extract
        env:
          FILE_PATH: ${{ steps.attachment.outputs.path }}
        run: |
          TEXT_OUT=""
          if [ -n "$FILE_PATH" ] && [ -f "$FILE_PATH" ]; then
            case "$FILE_PATH" in
              *.pdf)
                command -v pdftotext >/dev/null 2>&1 || sudo apt-get install -y poppler-utils >/dev/null 2>&1
                pdftotext -enc UTF-8 "$FILE_PATH" /tmp/extract.txt 2>/dev/null || true
                ;;
              *.txt|*.md)
                cp "$FILE_PATH" /tmp/extract.txt
                ;;
              *.docx)
                unzip -p "$FILE_PATH" word/document.xml 2>/dev/null | sed -e 's/<[^>]*>/ /g' > /tmp/extract.txt || true
                ;;
            esac
            if [ -f /tmp/extract.txt ] && [ -s /tmp/extract.txt ]; then
              tr -s ' \t\r' ' ' < /tmp/extract.txt | cut -c1-50000 > /tmp/extract_clean.txt
              if [ -s /tmp/extract_clean.txt ]; then
                TEXT_OUT="/tmp/extract_clean.txt"
                echo "已提取附件全文 $(wc -c < /tmp/extract_clean.txt) 字符（PDF/文本类可站内搜索）"
              fi
            fi
          fi
          echo "text_path=$TEXT_OUT" >> "$GITHUB_OUTPUT"

      - name: 由 Issue 生成文章文件
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          FILE_PATH: ${{ steps.attachment.outputs.path }}
          TEXT_PATH: ${{ steps.extract.outputs.text_path }}
          WORKER_URL: https://csu-shuliren.2544864177.workers.dev
        run: node scripts/build-post.js

      - name: 提交并推送到 main
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/posts
          git commit -m "publish: 投稿 #$ISSUE_NUMBER $ISSUE_TITLE"
          git push

      - name: 关闭 Issue 并通知作者
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ 审核通过，文章已发布，站点正在自动构建，几分钟后即可访问。"
          gh issue close "$ISSUE_NUMBER"

      - name: 触发站点构建部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-site.yml --ref main
